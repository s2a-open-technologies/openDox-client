# --- Vendored Go modules (go.mod `replace` -> ./third_party) ---------------------
# Licenses taken from the upstream notices in each directory; files that carry their
# own SPDX tag keep it (default precedence "closest"). Review when updating them.

# golang.design/x/hotkey
[[annotations]]
path = "third_party/hotkey/**"
SPDX-FileCopyrightText = "2021 The golang.design Initiative Authors"
SPDX-License-Identifier = "MIT"

# github.com/ricknicius99/hid (fork of karalabe/hid), see third_party/hid/LICENSE.md:
# Go wrapper BSD (hid.go: "3-clause BSD", go.hid/gowchar: BSD), hidapi 3-clause BSD,
# libusb LGPL-2.1-or-later (dynamically linked on Linux via pkg-config).
[[annotations]]
path = "third_party/hid/**"
SPDX-FileCopyrightText = "The hid authors (see third_party/hid/LICENSE.md)"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "third_party/hid/hidapi/**"
