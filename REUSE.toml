  "frontend/package-lock.json",
  "frontend/tsconfig.json",
  "frontend/vite.config.js",
  "frontend/wailsjs/go/**",
  "frontend/src/App.css",
  "frontend/src/App.tsx",
  "frontend/src/main.tsx",
  "frontend/src/style.css",
  "frontend/src/vite-env.d.ts",
  "frontend/src/lib/utils.ts",
  "frontend/src/components/DisclaimerGate.css",
  "frontend/src/components/LoginScreen.css",
  "frontend/src/components/LoginScreen.tsx",
  "frontend/src/components/Recorder.css",
  "frontend/src/components/ui/Button.tsx",
  "frontend/src/components/ui/ConfirmModal.tsx",
  "frontend/src/components/ui/Modal.css",
  "frontend/src/components/ui/ui.css",
]
