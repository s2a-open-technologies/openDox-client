# --- Own files -----------------------------------------------------------------

[[annotations]]
path = [
  "README.md",
  "CHANGELOG.md",
  "DISCLAIMER.md",
  "THIRD_PARTY_NOTICES.md",
  "AUTHORS",
  "docs/**",
  ".agents/AGENTS.md",
  ".github/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 S2A Open Technologies gGmbH"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
  ".gitignore",
  "go.mod",
  "go.sum",
  "wails.json",
  "scripts/compile.sh",
  "scripts/build-macos.sh",
  "scripts/build-windows-msi.sh",
  "scripts/release.sh",
  "build/windows/installer/opendox-client.wxs",
  "build/windows/installer/settings.json.template",
