name: Feature Request
description: Suggest an idea or enhancement for the openDox Client
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected and what is painful today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen instead / in addition?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Overlay UI / recording flow
        - Inserting text into other programs
        - Global hotkeys
        - Dictation microphones (SpeechMike / PowerMic)
        - Login (password / OIDC)
        - Installer / deployment (MSI, Intune, SCCM, GPO)
        - Server-managed client settings
        - Documentation
        - Other
