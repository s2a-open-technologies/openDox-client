# TEMPORARY: verifies the installer build on the branch without touching a release. Delete before merging.
name: Installers (test, branch only)
'on':
  push:
    branches:
    - ci/installers
permissions:
  contents: read
jobs:
  installers:
    name: Build and attach installers (unsigned)
    runs-on: ubuntu-latest
    env:
      TAG: test
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install system packages
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\n  pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libusb-1.0-0-dev \\\n  libx11-dev xorg-dev libxtst-dev libpng-dev xclip xsel xvfb \\\n  libxcb-xkb-dev x11-xkb-utils libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev \\\n  gcc-mingw-w64-x86-64 nsis msitools wixl\n"
    - name: Install the Wails CLI (version from go.mod)
      run: 'go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f ''{{.Version}}'' github.com/wailsapp/wails/v2)"

        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

        '
    - name: Build Linux binary and Windows NSIS installer
      run: xvfb-run -a ./scripts/compile.sh
    - name: Build Windows MSI
      run: xvfb-run -a ./scripts/build-windows-msi.sh
    - name: Stage assets with the fixed names
      run: 'mkdir stage

        cp build/bin/opendox-client-installer.msi stage/opendox-client-installer.msi

        cp build/bin/opendox-client-amd64-installer.exe stage/opendox-client-amd64-installer.exe

        # tar keeps the executable bit, which a plain download would lose

        tar -C build/bin -czf stage/opendox-client-linux-amd64.tar.gz opendox-client

        ls -l stage

        '
    - name: Keep as artifact for inspection (no release is touched)
      uses: actions/upload-artifact@v4
      with:
        name: installers-test
        path: stage/*
        if-no-files-found: error
