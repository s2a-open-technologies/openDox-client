name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Attach the installers to an already published release without tagging again:
  #   gh workflow run release.yml -f tag=v0.8.2
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the installers for (e.g. v0.8.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches wails.json version
        run: |
          current="$(python3 scripts/bump_version.py --current)"
          if [ "v${current}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match wails.json productVersion ${current}" \
              "(bump with scripts/bump_version.py --commit)"
            exit 1
          fi

      - name: Extract CHANGELOG section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $version" \
              "(expected a '## [$version]' heading — see scripts/bump_version.py)"
            exit 1
          fi
          cat >> release_notes.md <<'NOTE'

          ---
          Die Windows-Installer und das Linux-Binary werden in der CI gebaut und sind
          **nicht signiert**. Auf Windows 11 mit Smart App Control oder SmartScreen kann
          die Installation deshalb blockiert oder gewarnt werden. Signierte Builds
          ersetzen die Dateien gleichen Namens, sobald sie mit `scripts/release.sh`
          hochgeladen werden.
          NOTE

      # The manuals ship with every release (same as in the server repo). A failing
      # build fails the release on purpose, so no version goes out without its manual.
      # Pandoc and Typst run as Docker images; ImageMagick draws placeholders for
      # screenshots that don't exist yet.
      - name: Build user manuals (PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          OPENDOX_VERSION="${GITHUB_REF_NAME#v}" FORMATS=pdf scripts/build_handbuch.sh

      # The signed installers are built locally (Windows MSI/NSIS, macOS) and attached
      # afterwards with scripts/release.sh — the server's download buttons link to them.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # scripts/release.sh may have created the release already (installers first)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release_notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" build/handbuch/*.pdf --clobber

  # CycloneDX-SBOMs (Go-Module + produktive npm-Pakete) als Release-Assets. `mod` listet alle
  # Module aus go.mod unabhängig von der Plattform und braucht daher keine nativen Pakete.
  sbom:
    name: Attach SBOMs
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate SBOMs
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -json -licenses -output opendox-client-go.cdx.json .
          cd frontend
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@^1 --omit dev --output-format JSON \
            --output-file ../opendox-client-npm.cdx.json

      - name: Upload SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            opendox-client-go.cdx.json opendox-client-npm.cdx.json --clobber

  # Windows-Installer (NSIS .exe + MSI) und Linux-Binary. Alles wird unter Linux gebaut
  # (Windows per mingw-w64-Cross-Compile, MSI mit wixl), siehe scripts/compile.sh und
  # scripts/build-windows-msi.sh. macOS lässt sich so nicht bauen und bleibt lokal
  # (scripts/build-macos.sh + scripts/release.sh). Die Dateinamen sind FEST: der openDox-Server
  # (Admin → Clients) verlinkt auf releases/latest/download/<Name>, siehe
  # _CLIENT_DOWNLOAD_FILES im Server-Repo und scripts/release.sh.
  # Die Builds sind NICHT signiert. Ein später lokal mit scripts/release.sh hochgeladener,
  # signierter Build ersetzt die Datei gleichen Namens.
  installers:
    name: Build and attach installers (unsigned)
    needs: release
    # `release` is skipped on a manual run; run anyway then, but not after a failed release.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same native packages as ci.yml for the Linux build, plus the Windows cross toolchain:
      # mingw-w64 (compiler), nsis (makensis, .exe installer), wixl (.msi; own package on newer Ubuntu).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libusb-1.0-0-dev \
            libx11-dev xorg-dev libxtst-dev libpng-dev xclip xsel xvfb \
            libxcb-xkb-dev x11-xkb-utils libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev \
            gcc-mingw-w64-x86-64 nsis msitools wixl

      - name: Install the Wails CLI (version from go.mod)
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # xvfb: cgo steps of the X11-bound dependencies (hotkey) want a display while building.
      - name: Build Linux binary and Windows NSIS installer
        run: xvfb-run -a ./scripts/compile.sh

      - name: Build Windows MSI
        run: xvfb-run -a ./scripts/build-windows-msi.sh

      - name: Stage assets with the fixed names
        run: |
          mkdir stage
          cp build/bin/opendox-client-installer.msi stage/opendox-client-installer.msi
          cp build/bin/opendox-client-amd64-installer.exe stage/opendox-client-amd64-installer.exe
          # tar keeps the executable bit, which a plain download would lose; the license
          # texts have to travel with every binary copy
          cp LICENSE build/bin/LICENSE.txt
          cp THIRD_PARTY_LICENSES.txt build/bin/THIRD_PARTY_LICENSES.txt
          tar -C build/bin -czf stage/opendox-client-linux-amd64.tar.gz \
            opendox-client LICENSE.txt THIRD_PARTY_LICENSES.txt
          ls -l stage

      - name: Upload to the release
        run: gh release upload "${TAG}" stage/* --clobber
