name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go:
    name: Go (vet + tests) and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Native build dependencies: webkit2gtk-4.1 + gtk (Wails, webview_perms.go),
      # libusb (dictation mic, third_party/hid), X11/xkb (robotgo, global hotkeys),
      # xvfb (package main imports hotkey, which panics without an X11 display).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libusb-1.0-0-dev \
            libx11-dev xorg-dev libxtst-dev libpng-dev xclip xsel xvfb \
            libxcb-xkb-dev x11-xkb-utils libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev

      # main.go embeds frontend/dist (//go:embed), so it must exist before `go vet`.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^third_party/'))"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet -tags webkit2_41 ./...

      - name: go test
        run: xvfb-run -a go test -tags webkit2_41 ./...

      # The Windows-only packages cannot be built here (robotgo/cgo), but they can be vetted.
      - name: go vet (Windows internal packages)
        run: GOOS=windows go vet ./internal/...

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: REUSE lint
        uses: fsfe/reuse-action@v6
